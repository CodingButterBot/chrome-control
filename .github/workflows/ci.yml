name: Chrome Control CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Lint
      run: npm run lint
    
    - name: Run Zod schema tests
      run: npm run test:zod
    
    - name: Run unit tests
      run: npm run test:unit
    
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@latest
    
    - name: Run LLM simulation tests (headless)
      env:
        CI: true
      run: |
        # Modify the LLM simulation test to use headless mode for CI
        sed -i 's/headless: false/headless: true/g' tests/llm-simulation-test.js
        
        # Add timeout to ensure tests don't hang in CI
        sed -i 's/DEFAULT_TIMEOUT = 30000/DEFAULT_TIMEOUT = 60000/g' tests/llm-simulation-test.js
        
        # Run the LLM simulation test
        npm run test:llm-simulation
    
    - name: Check for screenshot artifacts
      run: |
        if [ -d "test-screenshots" ]; then
          echo "Screenshots generated during tests:"
          find test-screenshots -type f | sort
        fi

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Generate documentation
      run: npm run docs
    
    - name: Publish to npm (if version changed)
      id: publish
      uses: JS-DevTools/npm-publish@v1
      with:
        token: ${{ secrets.NPM_TOKEN }}
        access: public
    
    - name: Create Release
      if: steps.publish.outputs.type != 'none'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.publish.outputs.version }}
        release_name: Release v${{ steps.publish.outputs.version }}
        draft: false
        prerelease: false